<!-- ============================================================
     PROGREDO AG – Karriere-Widget für WordPress (Custom-HTML-Block)
     Offizieller Zoho Recruit Embed (Version 1.1) – produktiv.
     Stand: 10.11.2026
     ------------------------------------------------------------
     Was dieses Snippet macht:
     - Laedt die Stellen LIVE aus Zoho Recruit (progredo.zohorecruit.com,
       Career-Website-Seite "Careers") ueber das offizielle
       Zoho-Recruit-Embed-Widget (embed_jobs.js v1.1, zohocdn.com).
     - Bewerbungs-Button fuehrt in den echten Zoho-Recruit-
       Bewerbungsflow (Kandidat landt direkt in der Recruit-Pipeline).
     - Keine statischen/handgeschriebenen Stelleninhalte, keine Demo.
     ------------------------------------------------------------
     Einbau (WordPress):
     1. Seite "Karriere" (oder neu) oeffnen.
     2. Block "Custom HTML" hinzufuegen.
     3. Diesen Code 1:1 einfuegen und veroefflichen.
     ------------------------------------------------------------
     Live-Vorschau: https://sprintberlin.github.io/progredo-karriere-vorschau/
     Zoho-Doku: Setup > Career website > Embed jobs on your website
     ============================================================ -->
<style>
/* Layout-Container fuer das Zoho-Widget (kollisionsarm, geringe Spezifitaet) */
.pg-recruit-embed{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
@media(max-width:640px){.pg-recruit-embed{padding:1rem .5rem}}
</style>

<div class="pg-recruit-embed">
  <!-- ===== Offizieller Zoho Recruit Embed-Code (ab hier 1:1 aus Recruit) ===== -->
  <!-- Offizielles CSS von Zoho Recruit -->
  <link rel="stylesheet" href="https://static.zohocdn.com/recruit/embed_careers_site/css/v1.1/embed_jobs.css" type="text/css">
  <div class="embed_jobs_head embed_jobs_with_style_1">
    <div class="embed_jobs_head2">
      <div class="embed_jobs_head3">
        <div id="rec_job_listing_div"></div>
        <script type="text/javascript" src="https://static.zohocdn.com/recruit/embed_careers_site/javascript/v1.1/embed_jobs.js"></script>
        <script type="text/javascript">
          rec_embed_js.load({
            widget_id: "rec_job_listing_div",
            page_name: "Careers",
            source: "CareerSite",
            site: "https://progredo.zohorecruit.com",
            brand_color: "#6875E2",
            empty_job_msg: "Aktuell sind keine offenen Stellen verfuegbar."
          });
        </script>
      </div>
    </div>
  </div>
  <!-- ===== Ende offizieller Zoho Recruit Embed-Code ===== -->
</div>
