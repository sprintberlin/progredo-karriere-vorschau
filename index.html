<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PROGREDO AG – Karriere (Offizielles Zoho Recruit Widget)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 40px auto;
      max-width: 960px;
      padding: 0 20px;
      line-height: 1.5;
      color: #1e293b;
      background-color: #f8fafc;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #0f172a;
    }
    .header p {
      color: #64748b;
      font-size: 15px;
      margin: 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      border: 1px solid #e2e8f0;
      min-height: 300px;
    }
    .direct-link-note {
      margin-top: 24px;
      padding: 16px 20px;
      background: #f1f5f9;
      border-radius: 8px;
      font-size: 14px;
      color: #475569;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .direct-link-note a {
      color: #6875e2;
      text-decoration: none;
      font-weight: 600;
    }
    .direct-link-note a:hover {
      text-decoration: underline;
    }
  </style>

  <!-- Offizielles CSS von Zoho Recruit -->
  <link rel="stylesheet" href="https://static.zohocdn.com/recruit/embed_careers_site/css/v1.1/embed_jobs.css" type="text/css">
</head>
<body>

  <div class="header">
    <span class="badge">Offizieller Zoho Recruit Embed</span>
    <h1>Karriere bei der PROGREDO AG</h1>
    <p>Live-Einbindung über das offizielle Zoho Recruit Careers Widget</p>
  </div>

  <div class="card">
    <!-- Offizieller Zoho Recruit Embed Code -->
    <div class="embed_jobs_head embed_jobs_with_style_1">
      <div class="embed_jobs_head2">
        <div class="embed_jobs_head3">
          <div id="rec_job_listing_div"></div>
          <script type="text/javascript" src="https://static.zohocdn.com/recruit/embed_careers_site/javascript/v1.1/embed_jobs.js"></script>
          <script type="text/javascript">
            rec_embed_js.load({
              widget_id: "rec_job_listing_div",
              page_name: "Careers",
              source: "CareerSite",
              site: "https://progredo.zohorecruit.com",
              brand_color: "#6875E2",
              empty_job_msg: "Aktuell keine offenen Stellen verfuegbar."
            });
          </script>
        </div>
      </div>
    </div>
  </div>

  <div class="direct-link-note">
    <span>Direkter Aufruf der gehosteten Zoho-Karriereseite:</span>
    <a href="https://progredo.zohorecruit.com/jobs/Careers" target="_blank" rel="noopener">progredo.zohorecruit.com/jobs/Careers &rarr;</a>
  </div>

</body>
</html>
